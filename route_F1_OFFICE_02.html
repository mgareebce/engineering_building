<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الطريق إلى غرفة صغيرة جنب مختبر المساحة</title>
<style>
:root{--ink:#14213d;--muted:#5b6475;--bg:#f4f6fa;--card:#fff;--accent:#1f3a5f;--red:#dc1e1e;--green:#00964a;--blue:#2563eb}
*{box-sizing:border-box} body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--accent);color:#fff;padding:28px 32px;overflow:hidden}
@media (max-width:700px){header{padding:22px 18px} header h1{font-size:28px}}
header .label{opacity:.8;font-size:18px} header h1{margin:6px 0 10px;font-size:34px;line-height:1.35}
.who{font-size:24px;opacity:.95;margin-bottom:14px}
.floor{display:inline-block;background:#fff;color:var(--accent);font-weight:700;font-size:26px;padding:8px 22px;border-radius:999px}
.chip{display:inline-block;margin-inline-start:10px;border:2px solid #fff;color:#fff;font-size:20px;padding:6px 16px;border-radius:999px}
main{max-width:1200px;margin:0 auto;padding:24px 16px 48px}
.step{display:flex;gap:18px;background:var(--card);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.n{flex:0 0 52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center}
.body{flex:1;min-width:0} h2{margin:4px 0 6px;font-size:24px} p{margin:0 0 12px;font-size:19px;color:var(--muted)}
img{width:100%;height:auto;border-radius:10px;border:1px solid #dde3ec;background:#fff}
.legend{display:flex;gap:22px;flex-wrap:wrap;font-size:17px;color:var(--muted);margin:4px 0 18px}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;margin-inline-end:6px;vertical-align:-2px}
</style></head><body>
<header><div class="label">وجهتك</div><h1>غرفة صغيرة جنب مختبر المساحة</h1>
<span class="floor">الطابق الأول</span></header>
<main><div class="legend"><span><i class="dot" style="background:var(--green)"></i>أنت هنا</span>
<span><i class="dot" style="background:var(--blue)"></i>المصعد / الدرج</span><span><i class="dot" style="background:var(--red)"></i>وجهتك</span></div>
